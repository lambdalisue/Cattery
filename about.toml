# What `cargo about generate` (just licenses) accepts from the crates Cattery
# is built from. A crate under any other licence fails the generation, so a
# new licence is a decision made here rather than one that slips in.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "bzip2-1.0.6",
]
workarounds = ["ring"]
# The platforms releases are built for, whichever one generates the file, so
# it comes out the same everywhere.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Neither is in what a release ships.
ignore-dev-dependencies = true
ignore-build-dependencies = true
