[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# A placeholder: the tag is the only record of the version, and the release
# workflow stamps it here before building and publishing.
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lambdalisue/cattery"

[workspace.dependencies]
# felis is not on crates.io and promises no API, so every crate of it is
# pinned to the same revision and moved together.
felis-client-core = { git = "https://github.com/felis-terminal/felis", rev = "bc4af67fdd138e270c9d6f5316a6e9563df561ce" }
felis-daemon = { git = "https://github.com/felis-terminal/felis", rev = "bc4af67fdd138e270c9d6f5316a6e9563df561ce" }
felis-grid = { git = "https://github.com/felis-terminal/felis", rev = "bc4af67fdd138e270c9d6f5316a6e9563df561ce" }
felis-protocol = { git = "https://github.com/felis-terminal/felis", rev = "bc4af67fdd138e270c9d6f5316a6e9563df561ce" }
felis-render-core = { git = "https://github.com/felis-terminal/felis", rev = "bc4af67fdd138e270c9d6f5316a6e9563df561ce" }
felis-render-wgpu = { git = "https://github.com/felis-terminal/felis", rev = "bc4af67fdd138e270c9d6f5316a6e9563df561ce" }
felis-transport = { git = "https://github.com/felis-terminal/felis", rev = "bc4af67fdd138e270c9d6f5316a6e9563df561ce" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rustix = { version = "1.1.6", features = ["process"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# winit's types cross into felis's renderer, so its minor follows felis's.
winit = "0.30.13"

# Text shaping and font parsing dominate a debug build's frame time; a git
# dependency does not bring felis's own profile settings along.
[profile.dev.package]
felis-shaping = { opt-level = 1 }
harfrust = { opt-level = 1 }
skrifa = { opt-level = 1 }
read-fonts = { opt-level = 1 }
