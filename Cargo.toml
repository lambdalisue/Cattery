[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# A placeholder: the tag is the only record of the version, and the release
# workflow stamps it here before building and publishing.
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lambdalisue/cattery"

[workspace.dependencies]
# felis is not on crates.io and promises no API, so every crate of it is
# pinned to the same revision and moved together.
felis-client-core = { git = "https://github.com/felis-terminal/felis", rev = "43d04187c82926a355cdcc1a4559c0f6953a6379" }
felis-daemon = { git = "https://github.com/felis-terminal/felis", rev = "43d04187c82926a355cdcc1a4559c0f6953a6379" }
felis-grid = { git = "https://github.com/felis-terminal/felis", rev = "43d04187c82926a355cdcc1a4559c0f6953a6379" }
felis-protocol = { git = "https://github.com/felis-terminal/felis", rev = "43d04187c82926a355cdcc1a4559c0f6953a6379" }
felis-render-core = { git = "https://github.com/felis-terminal/felis", rev = "43d04187c82926a355cdcc1a4559c0f6953a6379" }
felis-render-wgpu = { git = "https://github.com/felis-terminal/felis", rev = "43d04187c82926a355cdcc1a4559c0f6953a6379" }
felis-transport = { git = "https://github.com/felis-terminal/felis", rev = "43d04187c82926a355cdcc1a4559c0f6953a6379" }

anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", features = ["winit"] }
fontdb = "0.24.0"
nucleo-matcher = "0.3.1"
# Only macOS and Windows use the menu, so its GTK backend for Linux stays out.
muda = { version = "0.21.2", default-features = false }
png = "0.18.1"
rfd = "0.18.0"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSAttributedString", "NSRange", "NSData", "NSBundle", "NSError", "NSGeometry", "NSArray", "NSURL"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6.2"
notify-rust = { version = "4.19.0", default-features = false, features = ["z-with-tokio"] }
egui-winit = "0.37.0"
rustix = { version = "1.1.6", features = ["process"] }
shell-words = "1.1.1"
tempfile = "3.27.0"
toml_edit = "0.25.19"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# winit's types cross into felis's renderer, so its minor follows felis's.
winit = "0.30.13"

# Text shaping and font parsing dominate a debug build's frame time; a git
# dependency does not bring felis's own profile settings along.
[profile.dev.package]
felis-shaping = { opt-level = 1 }
harfrust = { opt-level = 1 }
skrifa = { opt-level = 1 }
read-fonts = { opt-level = 1 }
